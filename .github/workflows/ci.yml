name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CNCSS.sln

      - name: Build
        run: dotnet build CNCSS.sln -c Release --no-restore

      - name: Test
        run: dotnet test CNCSS.sln -c Release --no-build --collect:"XPlat Code Coverage"
